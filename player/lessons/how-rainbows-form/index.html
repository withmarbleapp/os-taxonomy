<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>How does a rainbow form?</title>
    <link rel="stylesheet" href="/player/scene-base.css" />
    <link rel="stylesheet" href="scene/style.css" />
  </head>
  <body class="day-sky">
    <canvas id="world"></canvas>
    <div id="lesson-ui" hidden>
      <header><h1>How does a rainbow form?</h1></header>
      <aside id="explanation"><p id="instruction" role="status"></p></aside>
      <div id="window" aria-label="What Mia sees">
        <span class="window-label">What Mia sees</span>
        <div id="window-cover" hidden><span>?</span></div>
      </div>
      <div id="sun-badge" class="sun-marker" hidden></div>
      <div id="sun-veil" class="sun-veil" hidden></div>
      <button id="sun" class="object" aria-label="Lift the Sun higher or lower">
        <span class="button-label">Lift the Sun</span>
      </button>
      <button id="sun-cloud" class="object">
        <span class="button-label" id="sun-cloud-label">Cover the Sun</span>
      </button>
      <button id="water" class="object">
        <span class="button-label" id="water-label">Start the rain</span>
      </button>
      <button id="mia" class="object" aria-label="Move Mia. Drag, or use left and right arrow keys.">
        <span class="button-label">Move Mia</span>
      </button>
      <button id="gaze" class="object" aria-label="Turn Mia. Drag, or use left and right arrow keys.">
        <span class="button-label">Turn Mia</span>
      </button>
      <button id="beam" class="object" aria-label="Move the sunbeam. Drag, or use up and down arrow keys.">
        <span class="button-label">Move the sunbeam</span>
      </button>
      <div id="choices" hidden></div>
      <nav id="actions" aria-label="Help">
        <button id="resume" class="control" hidden>↗ Try it</button
        ><button id="hint" class="control" hidden>✧ Show a hint</button>
      </nav>
    </div>
    <script type="module" src="adapter.mjs"></script>
  </body>
</html>
