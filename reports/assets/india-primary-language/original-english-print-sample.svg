<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#f6f3ec"/><g font-family="DejaVu Sans,sans-serif" fill="#253c48"><text x="35" y="45" font-size="23">Original English configuration sample — cover and two interior pages</text><text x="35" y="77" font-size="15">Illustration only; no national language pair or programme certification. Keep teacher keys separate.</text><rect x="30" y="110" width="350" height="600" rx="4" fill="white" stroke="#a5afb1" stroke-width="2"/><rect x="425" y="110" width="350" height="600" rx="4" fill="white" stroke="#a5afb1" stroke-width="2"/><rect x="820" y="110" width="350" height="600" rx="4" fill="white" stroke="#a5afb1" stroke-width="2"/><text x="60" y="195" font-size="23">A Map for</text><text x="60" y="243" font-size="23">Our Table</text><text x="455" y="175" font-size="23">Mina draws a path.</text><text x="455" y="223" font-size="23">“Where does it go?”</text><text x="455" y="271" font-size="23">asks Dev.</text><text x="850" y="175" font-size="23">“It goes to the books,”</text><text x="850" y="223" font-size="23">says Mina.</text><text x="850" y="271" font-size="23">Dev adds a label:</text><text x="850" y="319" font-size="23">BOOKS.</text><path d="M80 390H280V570H80Z M110 490H255 M210 420V550" fill="none" stroke="#698b75" stroke-width="9"/><text x="67" y="650" font-size="16">An original model book</text><text x="590" y="680" font-size="17">1</text><text x="985" y="680" font-size="17">2</text></g></svg>
