<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc">
<title id="title">Six simple-machine arrangements</title><desc id="desc">Six original diagrams show a rigid bar turning about a support, a load on a slope, a tapered piece under a door, a spiral-threaded fastener, a fixed grooved wheel guiding a rope, and a wide knob connected to a narrow shaft. These are schematic arrangements, not construction instructions.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#146c89"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#123345} .card{fill:#fff;stroke:#c9d7df;stroke-width:2} .machine{stroke:#263e4c;stroke-width:5;fill:#dce8ee;stroke-linejoin:round}.line{stroke:#263e4c;stroke-width:5;fill:none}.motion{stroke:#146c89;stroke-width:4;fill:none;marker-end:url(#arrow)}.name{font-size:25px;font-weight:700}.caption{font-size:19px}.small{font-size:17px}</style>
<rect width="1200" height="870" fill="#edf3f6"/><text x="30" y="42" font-size="28" font-weight="700">Six arrangements to notice and explain</text><text x="30" y="72" class="caption">Look for the working feature. A useful machine need not have a motor.</text>
<g transform="translate(25 100)"><rect class="card" width="565" height="235" rx="12"/><text x="20" y="35" class="name">A · Lever</text><path class="machine" d="M355 179 L383 128 L411 179 Z"/><path class="line" d="M80 126 L480 126"/><rect class="machine" x="433" y="78" width="42" height="45"/><path class="motion" d="M104 65 V111"/><path class="motion" d="M491 115 V70"/><text x="25" y="207" class="caption">A bar turns around a support.</text><text x="167" y="86" class="small">effort</text><text x="425" y="62" class="small">load</text></g>
<g transform="translate(610 100)"><rect class="card" width="565" height="235" rx="12"/><text x="20" y="35" class="name">B · Inclined plane</text><path class="machine" d="M70 174 L470 174 L470 73 Z"/><g transform="translate(270 122) rotate(-14)"><rect class="machine" x="-25" y="-35" width="50" height="35"/></g><path class="motion" d="M314 106 L410 82"/><text x="25" y="207" class="caption">A load follows a sloping surface.</text></g>
<g transform="translate(25 350)"><rect class="card" width="565" height="235" rx="12"/><text x="20" y="35" class="name">C · Wedge</text><path class="line" d="M60 177 H505"/><rect class="machine" x="295" y="58" width="95" height="103"/><path class="machine" d="M175 172 L394 172 L175 128 Z"/><path class="motion" d="M85 151 H160"/><text x="25" y="207" class="caption">A tapered doorstop fits under a door.</text></g>
<g transform="translate(610 350)"><rect class="card" width="565" height="235" rx="12"/><text x="20" y="35" class="name">D · Screw</text><rect class="machine" x="223" y="56" width="110" height="27" rx="6"/><rect class="machine" x="257" y="83" width="40" height="95"/><path class="line" d="M248 100 L306 87 M248 123 L306 110 M248 146 L306 133 M248 169 L306 156"/><path class="motion" d="M344 78 C410 115 411 144 343 158"/><text x="25" y="207" class="caption">A spiral thread turns into or through a material.</text></g>
<g transform="translate(25 600)"><rect class="card" width="565" height="235" rx="12"/><text x="20" y="35" class="name">E · Pulley</text><path class="line" d="M151 53 H385 M268 53 V73"/><circle class="machine" cx="268" cy="104" r="32"/><path class="line" d="M235 160 V104 A33 33 0 0 1 301 104 V164"/><rect class="machine" x="214" y="160" width="42" height="25"/><path class="motion" d="M334 112 V166"/><path class="motion" d="M189 171 V122"/><text x="25" y="211" class="caption">One fixed wheel changes the pull's direction.</text></g>
<g transform="translate(610 600)"><rect class="card" width="565" height="235" rx="12"/><text x="20" y="35" class="name">F · Wheel and axle</text><path class="machine" d="M241 90 L438 90 L438 132 L241 132 Z"/><ellipse class="machine" cx="241" cy="111" rx="26" ry="65"/><path class="motion" d="M190 67 C148 87 150 146 193 165"/><text x="332" y="71" class="small">shaft / axle</text><text x="25" y="211" class="caption">A wide knob and its narrow shaft turn together.</text></g>
<text x="30" y="861" class="small">Original schematics. Use educational models or pictures; these are not instructions for handling tools or lifting loads.</text>
</svg>
