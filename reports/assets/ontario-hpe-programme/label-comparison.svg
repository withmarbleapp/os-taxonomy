<text x="40" y="1110" font-size="17">1. Compare the cereals: sugar, fibre and the given ratings. Which quantity basis makes the comparison fair?</text>
<text x="40" y="1145" font-size="17">2. Compare the snacks: sodium, saturated fat and the given ratings. The serve sizes are different.</text>
<text x="40" y="1180" font-size="17">3. Explain a choice using the panel AND rating within one category; never infer one overall diet from this.</text>
<text x="40" y="1230" font-size="17">No serving recommendation, calorie target, allergy assurance, retail endorsement or verified HSR calculation is supplied.</text>
