<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><rect width="1200" height="820" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#152735}.guide{fill:none;stroke:#8094a2;stroke-dasharray:5 5;stroke-width:1.2}.edge{stroke:#173c55;stroke-width:2;stroke-linejoin:round}</style><text x="25" y="28" font-size="22">Original one-point construction and comparison tasks</text><g transform="translate(15 40)"><text x="20" y="27" font-size="18">A · Chosen one-point view</text><path d="M20 90H555" stroke="#566c7b"/><text x="25" y="81" font-size="13">horizon</text><path class="guide" d="M100 190L420 90"/><path class="guide" d="M240 190L420 90"/><path class="guide" d="M100 300L420 90"/><path class="guide" d="M240 300L420 90"/><circle cx="420" cy="90" r="4" fill="#173c55"/><text x="429" y="82" font-size="13">V</text><polygon points="100,190 228.0,150.0 312.0,150.0 240,190" fill="#deedf4" class="edge"/><polygon points="240,190 312.0,150.0 312.0,216.0 240,300" fill="#9dc7dc" class="edge"/><rect x="100" y="190" width="140" height="110" fill="#f3f8fb" class="edge"/><text x="20" y="334" font-size="13">Only receding depth directions aim at V; front horizontals/verticals do not.</text></g><g transform="translate(620 40)"><text x="20" y="27" font-size="18">B · A different, parallel convention</text><path d="M20 90H555" stroke="#566c7b"/><text x="25" y="81" font-size="13">horizon</text><polygon points="100,190 170,140 310,140 240,190" fill="#deedf4" class="edge"/><polygon points="240,190 310,140 310,250 240,300" fill="#9dc7dc" class="edge"/><rect x="100" y="190" width="140" height="110" fill="#f3f8fb" class="edge"/><text x="20" y="334" font-size="13">A valid parallel convention; its depth edges stay parallel.</text></g><g transform="translate(15 425)"><text x="20" y="27" font-size="18">C · Diagnose a supplied candidate</text><path d="M20 90H555" stroke="#566c7b"/><text x="25" y="81" font-size="13">horizon</text><path class="guide" d="M100 190L420 90"/><path class="guide" d="M240 190L420 90"/><path class="guide" d="M100 300L420 90"/><path class="guide" d="M240 300L420 90"/><circle cx="420" cy="90" r="4" fill="#173c55"/><text x="429" y="82" font-size="13">V</text><polygon points="100,190 228.0,150.0 312.0,150.0 240,190" fill="#deedf4" class="edge"/><polygon points="240,190 312.0,150.0 312.0,216.0 240,300" fill="#9dc7dc" class="edge"/><rect x="100" y="190" width="140" height="110" fill="#f3f8fb" class="edge"/><path d="M240 190L510 66" stroke="#b32531" stroke-width="2" stroke-dasharray="7 4"/><circle cx="510" cy="66" r="4" fill="#b32531"/><text x="20" y="334" font-size="13">Does this red candidate fit the declared point? Repair its direction.</text></g><g transform="translate(620 425)"><text x="20" y="27" font-size="18">D · Transfer to another view</text><path d="M20 75H555" stroke="#566c7b"/><text x="25" y="66" font-size="13">horizon</text><path class="guide" d="M315 175L120 75"/><path class="guide" d="M455 175L120 75"/><path class="guide" d="M315 285L120 75"/><path class="guide" d="M455 285L120 75"/><circle cx="120" cy="75" r="4" fill="#173c55"/><text x="129" y="67" font-size="13">V</text><polygon points="315,175 237.0,135.0 321.0,135.0 455,175" fill="#deedf4" class="edge"/><polygon points="315,175 237.0,135.0 237.0,201.0 315,285" fill="#9dc7dc" class="edge"/><rect x="315" y="175" width="140" height="110" fill="#f3f8fb" class="edge"/><text x="20" y="334" font-size="13">Changed point and arrangement: the left side is now visible.</text></g></svg>