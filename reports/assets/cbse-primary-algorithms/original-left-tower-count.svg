<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title"><title id="title">Original all-left tower counting</title><rect width="1000" height="420" fill="white"/><g font-family="sans-serif" fill="#152b38"><text x="35" y="40" font-size="26">Count every shorter tower to the LEFT</text><text x="35" y="75" font-size="18">Record the count for each tower. Which two counts are 2?</text><path d="M75 300 H920" stroke="#344b59" stroke-width="2"/>
<rect x="110" y="195" width="28" height="105" fill="#bfd2dc" stroke="#152b38" stroke-width="2"/><text x="114" y="185" font-size="18">5</text><text x="114" y="330" font-size="23">A</text>
<rect x="250" y="258" width="28" height="42" fill="#bfd2dc" stroke="#152b38" stroke-width="2"/><text x="254" y="248" font-size="18">2</text><text x="254" y="330" font-size="23">B</text>
<rect x="390" y="132" width="28" height="168" fill="#bfd2dc" stroke="#152b38" stroke-width="2"/><text x="394" y="122" font-size="18">8</text><text x="394" y="330" font-size="23">C</text>
<rect x="530" y="279" width="28" height="21" fill="#bfd2dc" stroke="#152b38" stroke-width="2"/><text x="534" y="269" font-size="18">1</text><text x="534" y="330" font-size="23">D</text>
<rect x="670" y="153" width="28" height="147" fill="#bfd2dc" stroke="#152b38" stroke-width="2"/><text x="674" y="143" font-size="18">7</text><text x="674" y="330" font-size="23">E</text>
<rect x="810" y="216" width="28" height="84" fill="#bfd2dc" stroke="#152b38" stroke-width="2"/><text x="814" y="206" font-size="18">4</text><text x="814" y="330" font-size="23">F</text>
<text x="35" y="383" font-size="19">Changed case: F has height 9 units. Explain which counts change and which stay the same.</text></g></svg>
