<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1560" viewBox="0 0 1200 1560" role="img" aria-labelledby="title desc">
<title id="title">Original algorithmic task cards</title><desc id="desc">A nine-cell symbol path, a labelled movement grid, six three-length boxes, a star-scoring grid and six towers. These are original candidate assessment materials.</desc>
