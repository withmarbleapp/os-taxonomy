<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="960" viewBox="0 0 1100 960"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#234b60"/></marker></defs><rect width="1100" height="960" fill="#f7fafb"/><g font-family="DejaVu Sans,sans-serif" fill="#243e4c" stroke-linejoin="round"><text x="40" y="45" font-size="25">Original number algorithm flowcharts</text><text x="40" y="77" font-size="16">A: Set the current number to 7. Follow the arrows and record every update.</text><rect x="390" y="105" width="300" height="65" rx="8" fill="white" stroke="#73929e" stroke-width="2"/><text x="540.0" y="144.5" text-anchor="middle" font-size="20">Start: current number = 7</text><path d="M540.0,210 L700,265.0 L540.0,320 L380,265.0Z" fill="#e9f1d9" stroke="#73929e" stroke-width="2"/><text x="540.0" y="272.0" text-anchor="middle" font-size="20">Is current = 1?</text><rect x="820" y="230" width="180" height="65" rx="8" fill="white" stroke="#73929e" stroke-width="2"/><text x="910.0" y="269.5" text-anchor="middle" font-size="20">STOP</text><path d="M540 170V210" fill="none" stroke="#234b60" stroke-width="3" marker-end="url(#arrow)"/><path d="M700 265H820" fill="none" stroke="#234b60" stroke-width="3" marker-end="url(#arrow)"/><text x="740" y="250" font-size="17">Yes</text><path d="M540.0,370 L700,425.0 L540.0,480 L380,425.0Z" fill="#e9f1d9" stroke="#73929e" stroke-width="2"/><text x="540.0" y="432.0" text-anchor="middle" font-size="20">Is current even?</text><path d="M540 320V370" fill="none" stroke="#234b60" stroke-width="3" marker-end="url(#arrow)"/><text x="555" y="350" font-size="17">No</text><rect x="100" y="530" width="300" height="65" rx="8" fill="white" stroke="#73929e" stroke-width="2"/><text x="250.0" y="569.5" text-anchor="middle" font-size="20">Replace current with half</text><rect x="690" y="530" width="300" height="65" rx="8" fill="white" stroke="#73929e" stroke-width="2"/><text x="840.0" y="569.5" text-anchor="middle" font-size="20">Add 1 to current</text><path d="M380 425H250V530" fill="none" stroke="#234b60" stroke-width="3" marker-end="url(#arrow)"/><text x="300" y="411" font-size="17">Yes</text><path d="M700 425H840V530" fill="none" stroke="#234b60" stroke-width="3" marker-end="url(#arrow)"/><text x="740" y="411" font-size="17">No</text><path d="M250 595V640H40V265H380" fill="none" stroke="#234b60" stroke-width="3" marker-end="url(#arrow)"/><path d="M840 595V665H1050V190H540V210" fill="none" stroke="#234b60" stroke-width="3" marker-end="url(#arrow)"/><text x="420" y="700" font-size="17">Return to the first test after every update.</text><path d="M40 735H1060" stroke="#ccd8dc"/><text x="40" y="775" font-size="20">B: Make one update only, then stop.</text><path d="M225.0,805 L365,860.0 L225.0,915 L85,860.0Z" fill="#e9f1d9" stroke="#73929e" stroke-width="2"/><text x="225.0" y="867.0" text-anchor="middle" font-size="20">Is number &gt; 50?</text><rect x="490" y="800" width="250" height="60" rx="8" fill="white" stroke="#73929e" stroke-width="2"/><text x="615.0" y="837.0" text-anchor="middle" font-size="20">Yes: subtract 10</text><rect x="490" y="885" width="250" height="60" rx="8" fill="white" stroke="#73929e" stroke-width="2"/><text x="615.0" y="922.0" text-anchor="middle" font-size="20">No: double it</text><path d="M365 860H420V830H490" fill="none" stroke="#234b60" stroke-width="3" marker-end="url(#arrow)"/><path d="M225 915V930H465V915H490" fill="none" stroke="#234b60" stroke-width="3" marker-end="url(#arrow)"/><rect x="850" y="840" width="170" height="65" rx="8" fill="white" stroke="#73929e" stroke-width="2"/><text x="935.0" y="879.5" text-anchor="middle" font-size="20">STOP</text><path d="M740 830H790V858H850" fill="none" stroke="#234b60" stroke-width="3" marker-end="url(#arrow)"/><path d="M740 915H790V890H850" fill="none" stroke="#234b60" stroke-width="3" marker-end="url(#arrow)"/></g></svg>
