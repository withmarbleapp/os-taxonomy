<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title description">
<title id="title">Original reading-club model visual sheet</title>
<desc id="description">Four fictional teaching panels. A: room with door bottom left, books top left, sports bottom right, arrow up left edge. B: reading club poster with separate quiet-reading and group-story times and labelled icons. C: two displays of the same eight quiet-reading and ten group-story model responses; first axis starts zero, second seven. D: fictional exaggerated sign advertisement asking for private details, with no evidence or actual contact form.</desc>
<style>text{font-family:Arial,sans-serif;fill:#142329} .head{font-size:24px;font-weight:bold}.body{font-size:20px}.small{font-size:17px}.panel{fill:#fff;stroke:#647984;stroke-width:2}.line{fill:none;stroke:#142329;stroke-width:3}</style>
<rect width="1200" height="1080" fill="#edf1f3"/>
<text class="head" x="30" y="36">FICTIONAL MODEL — no actual school data, route approval or offer</text>
<rect class="panel" x="25" y="55" width="560" height="460" rx="8"/>
<text class="head" x="45" y="88">A. A model room plan</text>
<rect class="line" x="75" y="115" width="460" height="300"/>
<rect x="155" y="140" width="150" height="70" fill="#d9e9ee" stroke="#142329" stroke-width="2"/>
<text class="body" x="187" y="182">BOOKS</text>
<rect x="360" y="300" width="150" height="70" fill="#f2e5cc" stroke="#142329" stroke-width="2"/>
<text class="body" x="386" y="342">SPORTS</text>
<path class="line" d="M110 385 V175 H145"/><path class="line" d="M133 165 L145 175 L133 185"/>
<text class="body" x="88" y="444">DOOR</text>
<text class="small" x="45" y="480">Model route; actual room approval still required.</text>
<rect class="panel" x="615" y="55" width="560" height="460" rx="8"/>
<text class="head" x="635" y="88">B. Plain information poster</text>
<text x="660" y="150" font-size="38" font-weight="bold">READING CLUB</text>
<path class="line" d="M670 205 Q695 194 720 205 Q745 194 770 205 V250 Q745 239 720 250 Q695 239 670 250 Z M720 205 V250"/>
<text class="body" x="660" y="285">Quiet reading: first session.</text>
<path class="line" d="M675 325 h70 v42 h-40 l-15 14 v-14 h-15 Z M755 340 h70 v42 h-18 l-15 14 v-14 h-37 Z"/>
<text class="body" x="660" y="425">Group stories: next session.</text>
<text class="small" x="635" y="480">Icons match words; colour is not the only cue.</text>
<rect class="panel" x="25" y="540" width="560" height="500" rx="8"/>
<text class="head" x="45" y="574">C. Same 18 model responses</text>
<text class="small" x="55" y="612">Axis starts at 0</text><text class="small" x="320" y="612">Axis starts at 7</text>
<path class="line" d="M85 670 V930 H265 M335 670 V930 H525"/>
<rect x="115" y="754" width="50" height="176" fill="#37667a"/><rect x="195" y="710" width="50" height="220" fill="#b46627"/>
<text class="small" x="56" y="936">0</text><text class="small" x="56" y="826">5</text><text class="small" x="47" y="716">10</text>
<text class="body" x="130" y="743">8</text><text class="body" x="203" y="699">10</text>
<rect x="365" y="858" width="50" height="72" fill="#37667a"/><rect x="455" y="714" width="50" height="216" fill="#b46627"/>
<text class="small" x="306" y="936">7</text><text class="small" x="306" y="864">8</text><text class="small" x="306" y="792">9</text><text class="small" x="297" y="720">10</text>
<text class="body" x="381" y="847">8</text><text class="body" x="463" y="703">10</text>
<text class="small" x="102" y="960">Quiet</text><text class="small" x="185" y="960">Stories</text>
<text class="small" x="351" y="960">Quiet</text><text class="small" x="447" y="960">Stories</text>
<text class="small" x="45" y="1005">Compare counts, scale and visual impression.</text>
<rect class="panel" x="615" y="540" width="560" height="500" rx="8"/>
<text class="head" x="635" y="574">D. Fictional advertisement</text>
<text x="645" y="636" font-size="31" font-weight="bold" fill="#923518">SUPER SPARKLE SIGNS!</text>
<text class="body" x="645" y="689">EVERY child will read twice as fast!</text>
<text class="body" x="645" y="729">Our ten story votes PROVE it!</text>
<text class="body" x="645" y="789">Free badge? Send name, home address</text>
<text class="body" x="645" y="819">and a photograph. Everybody agrees!</text>
<text class="small" x="645" y="885">No reading-speed test or complete record supplied.</text>
<text class="small" x="645" y="915">No actual form, address or service exists here.</text>
<text class="small" x="645" y="960">Analyze the request; do not act on it.</text>
<text class="small" x="645" y="1005">An attractive design is not evidence of truth.</text>
</svg>