<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650"><rect width="800" height="650" fill="white"/>
<text x="30" y="40" font-size="24" font-family="sans-serif">Original teaching crossword</text>
<rect x="60" y="70" width="80" height="80" fill="white" stroke="#16283a" stroke-width="2"/>
<text x="65" y="88" font-size="16" font-family="sans-serif">1</text>
<rect x="140" y="70" width="80" height="80" fill="white" stroke="#16283a" stroke-width="2"/>
<text x="145" y="88" font-size="16" font-family="sans-serif">2</text>
<rect x="220" y="70" width="80" height="80" fill="white" stroke="#16283a" stroke-width="2"/>
<text x="225" y="88" font-size="16" font-family="sans-serif">3</text>
<rect x="60" y="150" width="80" height="80" fill="white" stroke="#16283a" stroke-width="2"/>
<text x="65" y="168" font-size="16" font-family="sans-serif">4</text>
<rect x="140" y="150" width="80" height="80" fill="white" stroke="#16283a" stroke-width="2"/>
<rect x="220" y="150" width="80" height="80" fill="white" stroke="#16283a" stroke-width="2"/>
<rect x="60" y="230" width="80" height="80" fill="white" stroke="#16283a" stroke-width="2"/>
<text x="65" y="248" font-size="16" font-family="sans-serif">5</text>
<rect x="140" y="230" width="80" height="80" fill="white" stroke="#16283a" stroke-width="2"/>
<rect x="220" y="230" width="80" height="80" fill="white" stroke="#16283a" stroke-width="2"/>
<g font-family="sans-serif" font-size="18" fill="#111"><text x="30" y="350">Across: 1, 4, 5. Down: 1, 2, 3.</text>
<text x="30" y="390">Across 1 / Down 1: A small animal with whiskers that often says meow.</text>
<text x="30" y="435">Across 4 / Down 2: The form in “We __ ready.”</text>
<text x="30" y="480">Across 5 / Down 3: The number just after nine.</text>
<text x="30" y="570">Each answer has three letters. Shared across/down answers are intentional.</text></g></svg>