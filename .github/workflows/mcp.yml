name: MCP server

on:
  pull_request:
    paths: ['mcp/**', 'data/**', '.github/workflows/mcp.yml']
  push:
    branches: [main]
    paths: ['mcp/**', 'data/**', '.github/workflows/mcp.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run mcp:install
      - run: npm run mcp:test
